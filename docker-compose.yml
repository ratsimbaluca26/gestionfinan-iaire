version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mon_budget_db
    restart: always
    environment:
      POSTGRES_DB: mon_budget
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mon_budget_backend
    restart: always
    depends_on:
      - db
    environment:
      PORT: 4000
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:3000
      JWT_SECRET: mettez-une-longue-chaine-aleatoire-ici
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mon_budget
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: mon_budget_frontend
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
