services:
  db:
    image: postgres:16-alpine
    container_name: mon_budget_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mon_budget_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-local_dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
  backend:
    build: ./backend
    container_name: mon_budget_dev_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      NODE_ENV: development
      CLIENT_ORIGIN: ${DEV_CLIENT_ORIGIN:-http://localhost:3001}
      JWT_SECRET: ${DEV_JWT_SECRET:-local-development-secret-change-me}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DEV_DB_PASSWORD:-local_dev_password}
      DB_NAME: mon_budget_dev
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:4001:4000"
  frontend:
    build: ./frontend
    container_name: mon_budget_dev_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API: ${DEV_API_URL:-http://localhost:4001/api}
      HOST: 0.0.0.0
      WDS_SOCKET_PORT: ${DEV_WDS_SOCKET_PORT:-3001}
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3001:3000"
volumes:
  postgres_dev_data:
