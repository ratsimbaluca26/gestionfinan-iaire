services:
  test-db:
    build:
      context: .
      dockerfile: ci/postgres.Dockerfile
    environment:
      POSTGRES_DB: mon_budget_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mon_budget_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-unit:
    build:
      context: ./backend
      dockerfile: Dockerfile.ci
    environment:
      NODE_ENV: test
    command: ["npm", "test"]

  backend-integration:
    build:
      context: ./backend
      dockerfile: Dockerfile.ci
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_NAME: mon_budget_test
      JWT_SECRET: ci-only-test-secret
      GMAIL_USER: ""
      GMAIL_APP_PASSWORD: ""
      CLIENT_ORIGIN: http://localhost:3001
    depends_on:
      test-db:
        condition: service_healthy
    command: ["npm", "run", "test:integration"]

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ci
    environment:
      CI: "true"
