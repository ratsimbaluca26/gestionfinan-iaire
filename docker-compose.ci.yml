services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mon_budget_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mon_budget_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-unit:
    image: node:20-alpine
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    environment:
      NODE_ENV: test
    command: >-
      sh -c "npm install --no-audit --no-fund --package-lock=false
      && npm test"

  backend-integration:
    image: node:20-alpine
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_NAME: mon_budget_test
      JWT_SECRET: ci-only-test-secret
      GMAIL_USER: ""
      GMAIL_APP_PASSWORD: ""
      CLIENT_ORIGIN: http://localhost:3001
    depends_on:
      test-db:
        condition: service_healthy
    command: >-
      sh -c "npm install --no-audit --no-fund --package-lock=false
      && npm run test:integration"

  frontend-build:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
    environment:
      CI: "true"
    command: >-
      sh -c "npm install --no-audit --no-fund --package-lock=false
      && npm run build"
