# ---------- 1. AWS : pare-feu (execute depuis Jenkins) ----------
- name: Security Group AWS
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Connaitre l'IP publique de Jenkins
      ansible.builtin.uri:
        url: https://api.ipify.org
        return_content: true
      register: my_ip

    - name: Definir les regles entrantes
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "{{ sg_description }}"
        region: "{{ aws_region }}"
        purge_rules: true
        rules:
          - { proto: tcp, ports: [22],  cidr_ip: "{{ my_ip.content | trim }}/32", rule_desc: "SSH Jenkins" }
          - { proto: tcp, ports: [80],  cidr_ip: 0.0.0.0/0, rule_desc: "HTTP" }
          - { proto: tcp, ports: [443], cidr_ip: 0.0.0.0/0, rule_desc: "HTTPS" }

# ---------- 2. Serveur EC2 ----------
- name: Configuration du serveur
  hosts: ec2
  become: true
  gather_facts: false

  pre_tasks:
    - name: Attendre que SSH soit disponible
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Collecter les facts
      ansible.builtin.setup:

  tasks:
    # --- Memoire : swap pour une instance de 1 Go de RAM ---
    - name: Creer le swap (RAM limitee)
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      args:
        creates: /swapfile

    - name: Rendre le swap persistant
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: Reduire la tendance a swapper
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-swappiness.conf
        content: "vm.swappiness=10\n"
        mode: "0644"

    - name: Appliquer swappiness
      ansible.builtin.command: sysctl -w vm.swappiness=10
      changed_when: false

    # --- Docker : paquets Ubuntu (docker.io), sans reinstallation a chaque run ---
    - name: Retirer uniquement les paquets Docker concurrents
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-engine
          - docker-compose-plugin
        state: absent

    - name: Paquets systeme
      ansible.builtin.apt:
        name: [git, curl, docker.io, docker-compose-v2, nginx, certbot, python3-certbot-nginx]
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: pkgs

    - name: Recharger systemd si les paquets ont change
      ansible.builtin.systemd:
        daemon_reload: true
      when: pkgs.changed

    - name: Reinitialiser l'etat d'echec de Docker
      ansible.builtin.command: systemctl reset-failed docker.service docker.socket
      changed_when: false
      failed_when: false

    - name: Redemarrer la socket Docker si les paquets ont change
      ansible.builtin.systemd:
        name: docker.socket
        state: restarted
        enabled: true
      when: pkgs.changed

    - name: Demarrer containerd, la socket et Docker
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - containerd
        - docker.socket
        - docker

    - name: Attendre que le socket Docker soit disponible
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        timeout: 20

    - name: ubuntu dans le groupe docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Recharger la session SSH pour prendre le groupe en compte
      ansible.builtin.meta: reset_connection

    # --- Application ---
    - name: Recuperer le code
      become: false
      ansible.builtin.git:
        repo: "{{ repo }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: true

    - name: Ecrire le .env
      become: false
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Lancer les conteneurs
      become: false
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr or 'Created' in compose.stderr"

    - name: Attendre PostgreSQL
      become: false
      ansible.builtin.command: docker compose exec -T db pg_isready -U postgres
      args:
        chdir: "{{ app_dir }}"
      register: pg
      retries: 15
      delay: 4
      until: pg.rc == 0
      changed_when: false

    - name: Aligner le mot de passe de la base sur le .env
      become: false
      ansible.builtin.command: docker compose exec -T db psql -U postgres -v ON_ERROR_STOP=1
      args:
        chdir: "{{ app_dir }}"
        stdin: "ALTER USER postgres PASSWORD '{{ db_password }}';"
      changed_when: false
      no_log: true

    - name: Redemarrer le backend apres alignement
      become: false
      ansible.builtin.command: docker compose restart backend
      args:
        chdir: "{{ app_dir }}"
      changed_when: false

    # --- Nginx et HTTPS ---
    - name: Configurer nginx
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/finiova
        mode: "0644"
      notify: Recharger nginx

    - name: Activer le site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/finiova
        dest: /etc/nginx/sites-enabled/finiova
        state: link
      notify: Recharger nginx

    - name: Retirer le site par defaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Recharger nginx

    - name: Appliquer nginx maintenant
      ansible.builtin.meta: flush_handlers

    # Le template nginx ecrase la config modifiee par certbot (bloc 443).
    # --reinstall remet le certificat existant dans nginx sans le re-emettre.
    - name: Certificat Let's Encrypt (emission ou reinstallation dans nginx)
      ansible.builtin.command: >
        certbot --nginx -d {{ domain }} -d www.{{ domain }}
        --non-interactive --agree-tos --redirect --reinstall
        -m {{ letsencrypt_email }}
      changed_when: false

    - name: Verifier que nginx ecoute sur le port 443
      ansible.builtin.wait_for:
        port: 443
        timeout: 30

    - name: Verifier le site en HTTPS
      become: false
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        status_code: 200
      register: health
      retries: 12
      delay: 10
      until: health.status == 200

  handlers:
    - name: Recharger nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded